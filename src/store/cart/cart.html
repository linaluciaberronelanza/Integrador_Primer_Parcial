<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Tienda Enmohecida</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="../../pages/client/home/home.html">
                <img src="/images/logo 1.png" alt="Logo MOLDFRY">
            </a>
        </div>
        <h1>MOLDFRY - Tu Selección Putrefacta</h1>
        <nav>
            <ul>
                <li><a href="../../pages/client/home/home.html">Volver al Catálogo</a></li>
                <li><button id="logoutButton" class="btn-logout">Salir</button></li>
            </ul>
        </nav>
    </header>

    <main class="main-login">
        <div class="login-box cart-box">

            <div class="linea-verde"></div>
            <h2 class="login-titulo">Detalle de tu Infección</h2>

            <div id="cart-items-container"></div>

            <hr>

            <div class="cart-total-container">
                <span>Total a pagar: </span>
                <strong class="cart-total-price" id="cart-total">$0.00</strong>
            </div>

            <div class="cart-actions">
                <button class="btn-ingresar btn-confirmar"
                    onclick="alert('Funcionalidad de pago no requerida para el parcial')">CONFIRMAR COMPRA</button>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container-footer">
            <div class="footer-column01">
                <h3 class="footer-titulo">LA TIENDA</h3>
                <img src="/images/logo 1.png" alt="Logo MOLDFRY" class="logo-footer">
                <p class="logo-description">Consuma bajo su propio riesgo.</p>
            </div>

            <div class="footer-column02">
                <h3 class="footer-titulo">UBICACIÓN</h3>
                <ul class="footer-list">
                    <li><i class="fa-solid fa-location-dot"></i> La Paz 1000, Rosario, Santa Fe, Argentina</li>
                    <li><a href="mailto:intoxicacion@comidaenmohecida.com" class="list-link"><i
                                class="fa-regular fa-envelope"></i> intoxicacion@comidaenmohecida.com</a></li>
                    <li><a href="https://api.whatsapp.com/send?phone=5493416465533" class="list-link"><i
                                class="fa-brands fa-whatsapp"></i> +549 3416465533</a></li>
                </ul>
            </div>

            <div class="footer-column03">
                <h3 class="footer-titulo">REDES</h3>
                <div class="socialmedia-icons">
                    <a href="#" class="icon-link"><i class="fa-brands fa-instagram fa-2xl"></i></a>
                    <a href="#" class="icon-link"><i class="fa-brands fa-square-facebook fa-2xl"></i></a>
                    <a href="#" class="icon-link"><i class="fa-brands fa-linkedin fa-2xl"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="./cart.ts"></script>
</body>

</html>
