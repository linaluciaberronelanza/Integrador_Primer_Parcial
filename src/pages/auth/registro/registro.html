<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tienda Enmohecida</title>
</head>

<body>
    <h1>Registro de Usuario</h1>

    <form id="form-registro">

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="off" required placeholder="tucorreo@ejemplo.com">
        </div>
        
        <div>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="off" required placeholder="********">
        </div>

        <button type="submit">Registrarse</button>

    </form>

    <br>
    <a href="../login/login.html">Ya tengo cuenta. Ir al Login.</a>

    <script type="module" src="./registro.ts"></script>
</body>

</html>
